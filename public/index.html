<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080809">
  <title>Thermalnote</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="login-view" class="login-view">
    <form id="login-form" class="login-card" aria-label="Sign in">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert"></p>
      <button id="login-button" class="primary" type="submit">Sign in</button>
    </form>
  </div>
  <div id="app-view" hidden>
  <div id="mode-workout" class="mode-workout" hidden>
    <header class="w-top"><div class="modes"><button type="button" data-mode="workout">Lift</button><button type="button" data-mode="notes">Notes</button></div><div class="w-top-right"><button id="w-status" class="save-status" title="Save now" aria-live="polite">Saved</button><button id="w-history-open" class="linkish">History</button></div></header>
    <div id="w-day" class="w-pane">
      <div class="w-datebar"><button id="w-prev" class="icon-button" aria-label="Previous day">‹</button><span class="w-dateblock"><button id="w-date">Today</button><small id="w-subdate"></small></span><button id="w-next" class="icon-button" aria-label="Next day">›</button></div>
      <div class="w-scroll">
        <p id="w-volume" class="w-summary"></p>
        <div id="w-movements"></div>
        <button id="w-add" class="w-add" type="button">+ Add movement</button>
        <section class="food">
          <div class="food-head"><h2>Food</h2><span id="w-protein"></span></div>
          <div id="w-meals"></div>
          <button id="w-add-meal" class="w-add quiet" type="button">+ Add meal</button>
        </section>
      </div>
      <footer class="w-bar"><button id="w-copy" class="primary" type="button">Copy day</button></footer>
    </div>
    <div id="w-history" class="w-pane" hidden>
      <div class="w-datebar"><button id="w-history-close" class="linkish">‹ Back</button><strong>History</strong></div>
      <div class="w-scroll" id="w-history-list"></div>
    </div>
  </div>
  <div id="mode-notes" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top"><button id="new-note" class="new-note"><span aria-hidden="true">＋</span> New note <kbd>Ctrl N</kbd></button><button id="close-sidebar" class="icon-button mobile-only" aria-label="Close notes">×</button></div>
      <div class="section-label"><span>Notes</span><span id="note-count">0</span></div>
      <nav id="note-list" class="note-list" aria-label="Notes"></nav>
      <div class="sidebar-bottom"><button id="logout" class="sign-out">Sign out</button></div>
    </aside>
    <button id="sidebar-shade" class="sidebar-shade" aria-label="Close notes" hidden></button>
    <main class="main">
      <header class="topbar"><div class="breadcrumbs"><button id="open-sidebar" class="icon-button mobile-only" aria-label="Open notes">☰</button><span id="crumb-title">New note</span></div><div class="top-actions"><div class="modes"><button type="button" data-mode="workout">Lift</button><button type="button" data-mode="notes">Notes</button></div><button id="study-button" class="study-button" title="Review what you marked"><span id="study-count">All cool</span></button><button id="save-status" class="save-status" title="Save now" aria-live="polite">Saved</button><button id="delete-note" class="icon-button" aria-label="Delete note" title="Delete note">⌫</button></div></header>
      <div id="save-error" class="save-error" role="alert" hidden><span></span><button id="retry-save">Try again</button><button id="copy-recovery" hidden>Keep as new note</button></div>
      <div class="editor-scroll" id="editor-scroll">
        <article class="writing-surface">
          <div class="note-meta"><span id="note-date"></span></div>
          <div id="note-title" class="note-title" contenteditable="true" role="textbox" aria-label="Note title" data-placeholder="Untitled" spellcheck="true"></div>
          <div class="editor-toolbar" role="toolbar" aria-label="Note formatting">
            <button id="format-bold" class="tool" title="Bold (Ctrl B)" aria-label="Bold"><b>B</b></button><button id="format-italic" class="tool" title="Italic (Ctrl I)" aria-label="Italic"><i>I</i></button><span class="toolbar-divider"></span><button id="add-link" class="tool labeled" title="Insert a link">Link</button><button id="add-image" class="tool labeled" title="Add an image">Image</button><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple hidden><span class="toolbar-divider"></span><button id="mark-passage" class="tool labeled" title="Mark this for review (Ctrl M)">Mark</button><div class="toolbar-spacer"></div><button id="heat-toggle" class="heat-toggle" aria-pressed="true" title="Toggle heat">Heat on</button>
          </div>
          <div id="note-body" class="note-body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note body" spellcheck="true"></div>
        </article>
      </div>
      <div id="study-bar" class="study-bar" hidden>
        <div class="study-where"><strong id="study-position">1 of 1</strong><span id="study-note">Untitled</span></div>
        <div class="study-actions">
          <button id="study-reveal" class="study-reveal">Reveal <kbd>Space</kbd></button>
          <button class="grade" data-result="forgot" hidden>Forgot <kbd>1</kbd></button>
          <button class="grade" data-result="hard" hidden>Hard <kbd>2</kbd></button>
          <button class="grade" data-result="got" hidden>Got it <kbd>3</kbd></button>
          <button id="study-exit" class="icon-button" aria-label="Leave review" title="Leave review (Esc)">×</button>
        </div>
      </div>
      <footer class="statusbar"><span id="word-count">0 words</span></footer>
    </main>
    </div>
  </div>
  <dialog id="w-picker" class="picker"><div class="picker-head"><input id="w-search" placeholder="Search movements" aria-label="Search movements" autocomplete="off"><button id="w-picker-close" type="button" class="icon-button" aria-label="Close">×</button></div><div id="w-picker-list" class="picker-list"></div></dialog>
  <dialog id="link-dialog"><form id="link-form"><div class="dialog-heading"><h2>Add a link</h2><button type="button" class="icon-button" id="close-link" aria-label="Close">×</button></div><label for="link-url">Web address</label><input id="link-url" type="url" placeholder="https://" required><label for="link-text">Text <span class="muted">(optional)</span></label><input id="link-text"><p id="link-error" class="error" role="alert"></p><button type="submit" class="primary">Insert link</button></form></dialog>
  <dialog id="delete-dialog"><form method="dialog"><h2>Delete this note?</h2><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="delete" class="danger">Delete note</button></div></form></dialog>
  <dialog id="image-viewer" class="image-viewer" aria-label="Image viewer">
    <div class="viewer-actions"><button id="viewer-zoom" class="viewer-button" aria-pressed="false" title="Zoom (+ / − / 0)">Zoom in</button><button id="viewer-full" class="viewer-button" title="Full screen (F)">Full screen</button><button id="viewer-close" class="icon-button" aria-label="Close image" title="Close (Esc)">×</button></div>
    <img id="viewer-image" alt="">
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body></html>
